<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1000" viewBox="0 0 760 1000">
  <rect width="760" height="1000" fill="#f7f5ef"/><rect x="52" y="48" width="656" height="904" fill="none" stroke="#b9b19d" stroke-width="2"/><text x="380" y="110" text-anchor="middle" font-size="31" font-family="SimSun, serif" fill="#202b33">土地流转合同</text><text x="380" y="150" text-anchor="middle" font-size="16" font-family="Microsoft YaHei, sans-serif" fill="#5a6470">合同编号：HT-2024-0116</text><g font-family="SimSun, serif" font-size="18" fill="#303a41"><text x="92" y="218">甲方：滨海新区农田运营管理单位</text><text x="92" y="268">乙方：浙江绿野粮食专业合作社</text><text x="92" y="318">流转区域：江滨农场二片区</text><text x="92" y="368">流转面积：1,640 亩</text><text x="92" y="418">合同期限：2024年03月18日至2026年11月20日</text><text x="92" y="500">一、双方应按照合同约定履行土地保护、租金缴纳</text><text x="92" y="548">和农作物种植管理责任。</text><text x="92" y="630">二、合同到期前应完成续签或退出交接手续。</text><text x="92" y="710">甲方（盖章）：________________</text><text x="430" y="710">乙方（盖章）：________________</text><text x="92" y="770">签订日期：2024年03月18日</text></g><path d="M560 844q30-36 70 0t70 0" fill="none" stroke="#bf4b4b" stroke-width="4"/><text x="92" y="874" font-size="15" font-family="Microsoft YaHei, sans-serif" fill="#8d7e6c">演示扫描件 · 仅用于系统功能展示</text>
</svg>
