<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#071b32" />
  <title>绍兴滨海新区农田数字化管理平台</title>
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://unpkg.com" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <aside class="sidebar">
      <div class="brand-block">
        <div class="brand-mark">农</div>
        <div>
          <div class="brand-name">滨海农田</div>
          <div class="brand-sub">数字化管理平台</div>
        </div>
      </div>

      <div class="side-project">
        <div class="side-project-label">当前项目</div>
        <div class="side-project-name">江滨农场数字化管理</div>
        <div class="side-project-meta"><span class="status-dot"></span> 系统运行正常</div>
      </div>

      <nav class="main-nav" aria-label="主导航">
        <div class="nav-group-label">业务总览</div>
        <button class="nav-item active" data-view="dashboard"><span class="nav-icon">▦</span><span>综合驾驶舱</span></button>
        <button class="nav-item" data-view="map"><span class="nav-icon">⌖</span><span>农田一张图</span></button>
        <button class="nav-item" data-view="owners"><span class="nav-icon">♙</span><span>流转大户</span></button>
        <button class="nav-item" data-view="crops"><span class="nav-icon">✿</span><span>作物维护</span></button>
        <button class="nav-item" data-view="analytics"><span class="nav-icon">▥</span><span>统计分析</span></button>
        <button class="nav-item" data-view="contracts"><span class="nav-icon">▤</span><span>合同监管</span><span class="nav-count warn">7</span></button>
        <div class="nav-group-label">智能监管</div>
        <button class="nav-item" data-view="meters"><span class="nav-icon">◒</span><span>电表监管</span><span class="nav-count danger">3</span></button>
        <button class="nav-item" data-view="drone"><span class="nav-icon">✦</span><span>无人机巡检</span></button>
        <button class="nav-item" data-view="video"><span class="nav-icon">▣</span><span>视频监控</span></button>
        <button class="nav-item" data-view="weather"><span class="nav-icon">◌</span><span>气象预警</span></button>
        <div class="nav-group-label">生产服务</div>
        <button class="nav-item" data-view="trace"><span class="nav-icon">⌁</span><span>农产品溯源</span></button>
        <button class="nav-item" data-view="broadcast"><span class="nav-icon">◉</span><span>应急广播</span></button>
      </nav>

      <div class="sidebar-bottom">
        <button class="nav-item" data-view="system"><span class="nav-icon">⚙</span><span>系统运维</span></button>
        <div class="security-note"><span class="shield">◆</span><div><strong>安全防护</strong><small>等保二级建设中</small></div></div>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div class="breadcrumb"><span id="breadcrumbRoot">业务总览</span><b>/</b><strong id="breadcrumbCurrent">综合驾驶舱</strong></div>
        <div class="top-actions">
          <div class="location-chip"><span>⌖</span> 绍兴市越城区 · 滨海新区</div>
          <div class="clock" id="clock">2026-09-18 09:30:00</div>
          <button class="icon-action" id="notificationButton" aria-label="查看通知">♧<span class="notify-dot"></span></button>
          <div class="user-chip"><div class="avatar">管</div><div><strong>项目管理员</strong><small>系统管理员</small></div><span class="chevron">⌄</span></div>
        </div>
      </header>

      <section id="content" class="content-area"></section>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="modalRoot"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="./config.js"></script>
  <script src="./assets/embedded-data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
